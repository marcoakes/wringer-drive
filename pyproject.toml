[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wringer-drive"
dynamic = ["version"]
description = "One verb: prose in, a board out. The operating surface for a product manager."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
# **No web server, and no dependency that implies one** (B1, inherited from
# SPEC_BOARD_V0 §1). It composes the two packages beside it.
dependencies = ["wringer", "wringer-board"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff"]

[project.scripts]
wringer-drive = "wringer_drive.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "wringer_drive.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# **`tests` only, and `examples/` is the reason.** `examples/pipeline/project`
# is a whole separate project with its own suite, shipped as plain files so
# `setup.sh` can make a real repository out of it. Without this, this package's
# own `pytest -q` walks into it, tries to collect tests for a `pipeline` module
# that is not installed here, and dies with five collection errors before
# running a single test of its own. Found by running it.
#
# The example's suite is not skipped: `test_the_acceptance_check_is_RED_and_the
# _suite_is_GREEN` runs it deliberately, in a copy, and asserts both colours.
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"
# Same reason: the example is another project's source, held to its own
# line-length and its own rules, not to this package's.
#
# `.engine/` and `.board/` are the sibling repositories CI checks out INSIDE
# this working directory so the imports this package makes are real ones. They
# are other projects too. Excluded here rather than by narrowing the command,
# so `ruff check .` means the same thing on a laptop and on a runner — CI ran
# it once against the engine's `benchmark/` and reported 41 errors in code this
# repository does not own.
extend-exclude = ["examples/", ".engine/", ".board/"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
